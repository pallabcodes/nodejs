# ---------------------------------------------
# 📦 .github/workflows/deploy.yml
# Production-Grade CI/CD Pipeline
# ---------------------------------------------

name: 🚀 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 18
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===================================
  # 🧪 Test & Quality Assurance
  # ===================================
  test:
    name: 🧪 Test & Quality Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint

      - name: 🎨 Check code formatting
        run: npm run format:check

      - name: 🧪 Run unit tests
        run: npm run test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://root:test_password@localhost:3306/test_db
          REDIS_URL: redis://localhost:6379

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: 🔒 Security audit
        run: npm run security:audit

  # ===================================
  # 🔒 Security Scanning
  # ===================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run security audit
        run: npm audit --audit-level=moderate

      - name: 🔒 CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: 🔒 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ===================================
  # 🏗️ Build & Package
  # ===================================
  build:
    name: 🏗️ Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===================================
  # 🚀 Deploy to Production
  # ===================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: production
      url: https://api.smartvault.com

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --production

      - name: � Deploy to server
        run: |
          echo "🚀 Deploying to production server..."
          # Add your deployment script here
          # Example: rsync, ssh, kubectl, etc.
          
      - name: 💬 Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: '🚀 Deployment to production: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ===================================
  # 🧪 Post-Deploy Health Check
  # ===================================
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🏥 Check application health
        run: |
          echo "🏥 Checking application health..."
          # Wait for deployment to stabilize
          sleep 30
          
          # Health check
          curl -f https://api.smartvault.com/health || exit 1
          curl -f https://api.smartvault.com/ready || exit 1
          
          echo "✅ Health check passed!"

      - name: 📊 Performance test
        run: |
          echo "📊 Running basic performance test..."
          # Basic performance check
          curl -w "@curl-format.txt" -o /dev/null -s https://api.smartvault.com/health

      - name: ⚙️ Build (if needed)
        run: echo "No build step configured"

      - name: 🐳 Docker Build
        run: docker build -t fp-middleware-api .

      - name: ✅ Run container (optional test run)
        run: |
          docker run -d -p 3000:3000 \
            -e NODE_ENV=production \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            fp-middleware-api

      # Uncomment to deploy via SSH/PM2, Render, etc.
      # - name: 🚀 Deploy to Server
      #   uses: easingthemes/ssh-deploy@main
      #   with:
      #     ssh-private-key: ${{ secrets.SSH_KEY }}
      #     remote-user: ubuntu
      #     server-ip: ${{ secrets.SERVER_IP }}
      #     remote-path: /home/ubuntu/app
      #     local-path: .

      # - name: ✅ Restart via PM2
      #   run: ssh ubuntu@${{ secrets.SERVER_IP }} "pm2 restart ecosystem.config.js"

      - name: 🚀 Run PM2 Deployment Script
        run: bash ./scripts/deploy.sh

      - name: ✅ Done
        run: echo "✅ Deployment pipeline complete."

# 📌 Requirements:
# - Add JWT_SECRET (and optional SERVER_IP, SSH_KEY, etc.) to GitHub Secrets
# - Uncomment deploy blocks to enable deployment
